<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Prevents browser caching during development -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Donegal Explorer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body class="home-page">

  <main class="hero-content">
    
    <header class="home-header">
      <img src="./assets/logo.png" alt="Donegal Explorer Logo" class="app-logo home-logo">
      <div class="header-text-group">
        <h1>Donegal Explorer</h1>
        <p>Discover the Sights & Sounds of the Wilds</p>
      </div>
    </header>

    <div class="home-container">
      <div class="welcome-box">
        <h2>Welcome to the Wilds</h2>
        <p>Explore the unique sights and sounds along the cliffs, bogs, and glens of County Donegal.</p>
        <div class="button-stack">
  <a href="birds.html" class="start-btn">Listen to Bird Calls</a>
  <a href="fish.html" class="start-btn secondary-btn">Identify Local Fish</a>
        </div>
      </div>
    </div>

  </main>

 <script>
  // UNREGISTER ALL ACTIVE SERVICE WORKERS & CLEAR CACHES
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) {
        registration.unregister();
        console.log("Service Worker successfully unregistered.");
      }
    });

    // Wipes out local offline cache storage
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
          console.log("Cache cleared:", name);
        }
      });
    }
  }
</script>
</body>
</html>
